AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MVP transcription app (S3 + Lambda + HTTP API + DynamoDB + Whisper ECS worker + static frontend)

Parameters:
  SpeakerIdImageUri:
    Type: String
    Default: ''
    Description: ECR image URI for SpeakerIdFunction (built via CodeBuild). Leave blank to skip creating SpeakerIdFunction.
  AsrWorkerImageUri:
    Type: String
    Default: ''
    Description: ECR image URI for ASR worker ECS task (built via CodeBuild).
  AsrEngine:
    Type: String
    Default: whisper
    AllowedValues:
      - whisper
      - transcribe
    Description: Active ASR engine used by API Lambda.
  HfToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Hugging Face token for pyannote model download.
  WhisperModel:
    Type: String
    Default: medium
    Description: faster-whisper model size for ASR worker.
  PyannoteModel:
    Type: String
    Default: pyannote/speaker-diarization-3.1
    Description: Pyannote diarization model ID.
  AsrGpuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2/gpu/recommended/image_id
    Description: ECS-optimized GPU AMI ID (via SSM parameter).
  EnableManagedSql:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to false to disable managed Aurora SQL creation unless external SQL ARNs are provided.
  EnableGpuPath:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to true to enable GPU ECS capacity/resources.
  AsrDispatchMode:
    Type: String
    Default: queue_service
    AllowedValues:
      - queue_service
      - run_task
    Description: ASR dispatch mode used by API Lambda (queue_service or run_task).
  EcsPreferGpu:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: When run_task mode is used, prefer GPU capacity providers before CPU Fargate fallback.
  SqlClusterArn:
    Type: String
    Default: ''
    Description: Existing Aurora PostgreSQL cluster ARN (Data API enabled). Leave blank to disable SQL analytics.
  SqlSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for Aurora credentials.
  SqlDatabase:
    Type: String
    Default: lumi
    Description: Aurora database name.

Conditions:
  HasSpeakerIdImage: !Not [!Equals [!Ref SpeakerIdImageUri, '']]
  HasAsrWorkerImage: !Not [!Equals [!Ref AsrWorkerImageUri, '']]
  EnableManagedSqlCondition: !Equals [!Ref EnableManagedSql, 'true']
  UseGpuPath: !Equals [!Ref EnableGpuPath, 'true']
  HasExternalSql: !And
    - !Not [!Equals [!Ref SqlClusterArn, '']]
    - !Not [!Equals [!Ref SqlSecretArn, '']]
  CreateManagedSql: !And
    - !Condition EnableManagedSqlCondition
    - !Not [!Condition HasExternalSql]
  HasSql: !Or
    - !Condition HasExternalSql
    - !Condition CreateManagedSql
  HasAsrWorkerImageAndGpu: !And
    - !Condition HasAsrWorkerImage
    - !Condition UseGpuPath

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawTranscriptArtifacts
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 30

  AnalyticsVpc:
    Condition: CreateManagedSql
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  AnalyticsPrivateSubnetA:
    Condition: CreateManagedSql
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AnalyticsVpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  AnalyticsPrivateSubnetB:
    Condition: CreateManagedSql
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AnalyticsVpc
      CidrBlock: 10.50.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false

  AnalyticsDbSubnetGroup:
    Condition: CreateManagedSql
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Aurora SQL analytics
      SubnetIds:
        - !Ref AnalyticsPrivateSubnetA
        - !Ref AnalyticsPrivateSubnetB

  AnalyticsDbSecurityGroup:
    Condition: CreateManagedSql
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora analytics SG
      VpcId: !Ref AnalyticsVpc

  AnalyticsDbCluster:
    Condition: CreateManagedSql
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      DatabaseName: lumi
      DBSubnetGroupName: !Ref AnalyticsDbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AnalyticsDbSecurityGroup
      MasterUsername: masteruser
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1

  AnalyticsDbInstance:
    Condition: CreateManagedSql
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AnalyticsDbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-${AWS::Region}-frontend-oac'
        Description: OAC for private frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} frontend distribution'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        IPV6Enabled: true
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: https-only
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServiceGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource:
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  TranscriptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: transcriptId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: transcriptId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: TranscriptIdIndex
          KeySchema:
            - AttributeName: transcriptId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DailyWordStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: dayRole
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: dayRole
          KeyType: RANGE

  AsrJobsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AsrJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 7200
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AsrJobsDlq.Arn
        maxReceiveCount: 3

  AsrWarmStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scope
          AttributeType: S
      KeySchema:
        - AttributeName: scope
          KeyType: HASH

  AsrVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  AsrInternetGateway:
    Type: AWS::EC2::InternetGateway

  AsrVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AsrVpc
      InternetGatewayId: !Ref AsrInternetGateway

  AsrPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AsrVpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  AsrPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AsrVpc
      CidrBlock: 10.60.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  AsrPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AsrVpc

  AsrPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AsrVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref AsrPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref AsrInternetGateway

  AsrSubnetRouteAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AsrPublicSubnetA
      RouteTableId: !Ref AsrPublicRouteTable

  AsrSubnetRouteAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AsrPublicSubnetB
      RouteTableId: !Ref AsrPublicRouteTable

  AsrTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ASR worker ECS task security group
      VpcId: !Ref AsrVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AsrWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ecs/${AWS::StackName}-asr-worker'
      RetentionInDays: 7

  AsrEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-asr'
      CapacityProviders: !If
        - UseGpuPath
        - [!Ref AsrGpuSpotCapacityProvider, !Ref AsrGpuOnDemandCapacityProvider]
        - !Ref AWS::NoValue
      DefaultCapacityProviderStrategy: !If
        - UseGpuPath
        - - CapacityProvider: !Ref AsrGpuSpotCapacityProvider
            Weight: 1
          - CapacityProvider: !Ref AsrGpuOnDemandCapacityProvider
            Weight: 1
        - !Ref AWS::NoValue

  AsrEc2InstanceRole:
    Condition: UseGpuPath
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  AsrEc2InstanceProfile:
    Condition: UseGpuPath
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AsrEc2InstanceRole

  AsrGpuSpotLaunchTemplate:
    Condition: UseGpuPath
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AsrGpuAmiId
        InstanceType: g4dn.xlarge
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 80
              VolumeType: gp3
              DeleteOnTermination: true
        IamInstanceProfile:
          Arn: !GetAtt AsrEc2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AsrTaskSecurityGroup
        InstanceMarketOptions:
          MarketType: spot
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${AWS::StackName}-asr >> /etc/ecs/ecs.config
            echo ECS_ENABLE_TASK_ENI=true >> /etc/ecs/ecs.config
            echo ECS_ENABLE_GPU_SUPPORT=true >> /etc/ecs/ecs.config
            echo ECS_ENABLE_SPOT_INSTANCE_DRAINING=true >> /etc/ecs/ecs.config

  AsrGpuOnDemandLaunchTemplate:
    Condition: UseGpuPath
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AsrGpuAmiId
        InstanceType: g4dn.xlarge
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 80
              VolumeType: gp3
              DeleteOnTermination: true
        IamInstanceProfile:
          Arn: !GetAtt AsrEc2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AsrTaskSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${AWS::StackName}-asr >> /etc/ecs/ecs.config
            echo ECS_ENABLE_TASK_ENI=true >> /etc/ecs/ecs.config
            echo ECS_ENABLE_GPU_SUPPORT=true >> /etc/ecs/ecs.config

  AsrGpuSpotAutoScalingGroup:
    Condition: UseGpuPath
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '0'
      MaxSize: '2'
      DesiredCapacity: '0'
      VPCZoneIdentifier:
        - !Ref AsrPublicSubnetA
        - !Ref AsrPublicSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref AsrGpuSpotLaunchTemplate
        Version: !GetAtt AsrGpuSpotLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-asr-gpu-spot'
          PropagateAtLaunch: true

  AsrGpuOnDemandAutoScalingGroup:
    Condition: UseGpuPath
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier:
        - !Ref AsrPublicSubnetA
        - !Ref AsrPublicSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref AsrGpuOnDemandLaunchTemplate
        Version: !GetAtt AsrGpuOnDemandLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-asr-gpu-ondemand'
          PropagateAtLaunch: true

  AsrGpuSpotCapacityProvider:
    Condition: UseGpuPath
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !GetAtt AsrGpuSpotAutoScalingGroup.AutoScalingGroupARN
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
        ManagedTerminationProtection: DISABLED

  AsrGpuOnDemandCapacityProvider:
    Condition: UseGpuPath
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !GetAtt AsrGpuOnDemandAutoScalingGroup.AutoScalingGroupARN
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
        ManagedTerminationProtection: DISABLED

  AsrTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  AsrTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AsrTaskAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub '${UploadsBucket.Arn}/uploads/*'
                  - !Sub '${UploadsBucket.Arn}/calibrations/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${ArtifactsBucket.Arn}/transcripts/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TranscriptsTable.Arn
                  - !Sub '${TranscriptsTable.Arn}/index/*'
                  - !GetAtt DailyWordStatsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AsrJobsQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AsrWarmStateTable.Arn
              - !If
                - HasSpeakerIdImage
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: !GetAtt SpeakerIdFunction.Arn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'

  AsrWorkerTaskDefinition:
    Condition: HasAsrWorkerImageAndGpu
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-asr-worker'
      Cpu: '3072'
      Memory: '12288'
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt AsrTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AsrTaskRole.Arn
      ContainerDefinitions:
        - Name: asr-worker
          Image: !Ref AsrWorkerImageUri
          Essential: true
          ResourceRequirements:
            - Type: GPU
              Value: '1'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: '127.0.0.1:2000'
            - Name: ECS_GPU_TASK_NETWORK_MODE
              Value: bridge
            - Name: UPLOADS_BUCKET
              Value: !Ref UploadsBucket
            - Name: ARTIFACTS_BUCKET
              Value: !Ref ArtifactsBucket
            - Name: CALIBRATION_BUCKET
              Value: !Ref UploadsBucket
            - Name: TRANSCRIPTS_TABLE
              Value: !Ref TranscriptsTable
            - Name: TRANSCRIPT_ID_INDEX
              Value: TranscriptIdIndex
            - Name: DAILY_WORD_STATS_TABLE
              Value: !Ref DailyWordStatsTable
            - Name: ASR_JOBS_QUEUE_URL
              Value: !Ref AsrJobsQueue
            - Name: ASR_WARM_STATE_TABLE
              Value: !Ref AsrWarmStateTable
            - Name: SPEAKER_ID_FUNCTION_NAME
              Value: !If [HasSpeakerIdImage, !Ref SpeakerIdFunction, '']
            - Name: SQL_CLUSTER_ARN
              Value: !If
                - HasSql
                - !If [HasExternalSql, !Ref SqlClusterArn, !GetAtt AnalyticsDbCluster.DBClusterArn]
                - ''
            - Name: SQL_SECRET_ARN
              Value: !If
                - HasSql
                - !If [HasExternalSql, !Ref SqlSecretArn, !GetAtt AnalyticsDbCluster.MasterUserSecret.SecretArn]
                - ''
            - Name: SQL_DATABASE
              Value: !If [HasSql, !Ref SqlDatabase, '']
            - Name: WHISPER_MODEL
              Value: !Ref WhisperModel
            - Name: WHISPER_DEVICE_POLICY
              Value: cuda
            - Name: PYANNOTE_MODEL
              Value: !Ref PyannoteModel
            - Name: HF_TOKEN
              Value: !Ref HfToken
            - Name: SPEAKER_ID_DEVICE_POLICY
              Value: cuda
            - Name: GPU_ONLY_PIPELINE
              Value: 'true'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AsrWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: asr
        - Name: xray-daemon
          Image: public.ecr.aws/xray/aws-xray-daemon:latest
          Essential: false
          Cpu: 32
          Memory: 256
          PortMappings:
            - ContainerPort: 2000
              HostPort: 2000
              Protocol: udp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AsrWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: xray

  AsrWorkerTaskDefinitionFargate:
    Condition: HasAsrWorkerImage
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-asr-worker-fargate'
      Cpu: '2048'
      Memory: '8192'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt AsrTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AsrTaskRole.Arn
      ContainerDefinitions:
        - Name: asr-worker
          Image: !Ref AsrWorkerImageUri
          Essential: true
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: '127.0.0.1:2000'
            - Name: UPLOADS_BUCKET
              Value: !Ref UploadsBucket
            - Name: ARTIFACTS_BUCKET
              Value: !Ref ArtifactsBucket
            - Name: CALIBRATION_BUCKET
              Value: !Ref UploadsBucket
            - Name: TRANSCRIPTS_TABLE
              Value: !Ref TranscriptsTable
            - Name: TRANSCRIPT_ID_INDEX
              Value: TranscriptIdIndex
            - Name: DAILY_WORD_STATS_TABLE
              Value: !Ref DailyWordStatsTable
            - Name: ASR_JOBS_QUEUE_URL
              Value: !Ref AsrJobsQueue
            - Name: ASR_WARM_STATE_TABLE
              Value: !Ref AsrWarmStateTable
            - Name: SPEAKER_ID_FUNCTION_NAME
              Value: !If [HasSpeakerIdImage, !Ref SpeakerIdFunction, '']
            - Name: SQL_CLUSTER_ARN
              Value: !If
                - HasSql
                - !If [HasExternalSql, !Ref SqlClusterArn, !GetAtt AnalyticsDbCluster.DBClusterArn]
                - ''
            - Name: SQL_SECRET_ARN
              Value: !If
                - HasSql
                - !If [HasExternalSql, !Ref SqlSecretArn, !GetAtt AnalyticsDbCluster.MasterUserSecret.SecretArn]
                - ''
            - Name: SQL_DATABASE
              Value: !If [HasSql, !Ref SqlDatabase, '']
            - Name: WHISPER_MODEL
              Value: !Ref WhisperModel
            - Name: WHISPER_DEVICE_POLICY
              Value: cuda
            - Name: PYANNOTE_MODEL
              Value: !Ref PyannoteModel
            - Name: HF_TOKEN
              Value: !Ref HfToken
            - Name: SPEAKER_ID_DEVICE_POLICY
              Value: cuda
            - Name: GPU_ONLY_PIPELINE
              Value: 'true'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AsrWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: asr
        - Name: xray-daemon
          Image: public.ecr.aws/xray/aws-xray-daemon:latest
          Essential: false
          Cpu: 32
          Memory: 256
          PortMappings:
            - ContainerPort: 2000
              Protocol: udp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AsrWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: xray

  AsrWorkerService:
    Condition: HasAsrWorkerImage
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-asr-service'
      Cluster: !Ref AsrEcsCluster
      TaskDefinition: !If [HasAsrWorkerImageAndGpu, !Ref AsrWorkerTaskDefinition, !Ref AsrWorkerTaskDefinitionFargate]
      DesiredCount: 0
      LaunchType: !If [HasAsrWorkerImageAndGpu, !Ref AWS::NoValue, FARGATE]
      PlatformVersion: !If [HasAsrWorkerImageAndGpu, !Ref AWS::NoValue, LATEST]
      CapacityProviderStrategy: !If
        - HasAsrWorkerImageAndGpu
        - - CapacityProvider: !Ref AsrGpuOnDemandCapacityProvider
            Weight: 1
        - !Ref AWS::NoValue
      NetworkConfiguration: !If
        - HasAsrWorkerImageAndGpu
        - !Ref AWS::NoValue
        - AwsvpcConfiguration:
            AssignPublicIp: ENABLED
            Subnets:
              - !Ref AsrPublicSubnetA
              - !Ref AsrPublicSubnetB
            SecurityGroups:
              - !Ref AsrTaskSecurityGroup

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Tracing: Active
      CodeUri: ../backend/src
      Handler: app.handler
      Environment:
        Variables:
          ASR_ENGINE: !Ref AsrEngine
          ASR_DISPATCH_MODE: !Ref AsrDispatchMode
          UPLOADS_BUCKET: !Ref UploadsBucket
          ARTIFACTS_BUCKET: !Ref ArtifactsBucket
          CALIBRATION_BUCKET: !Ref UploadsBucket
          TRANSCRIPTS_TABLE: !Ref TranscriptsTable
          TRANSCRIPT_ID_INDEX: TranscriptIdIndex
          DAILY_WORD_STATS_TABLE: !Ref DailyWordStatsTable
          ASR_JOBS_QUEUE_URL: !Ref AsrJobsQueue
          ASR_WARM_STATE_TABLE: !Ref AsrWarmStateTable
          ASR_WORKER_SERVICE_NAME: !If [HasAsrWorkerImage, !Ref AsrWorkerService, '']
          ASR_WARM_WINDOW_SECONDS: '300'
          ASR_ACTIVITY_TOUCH_THROTTLE_SECONDS: '30'
          GPU_ONLY_PIPELINE: 'true'
          SPEAKER_ID_FUNCTION_NAME: !If [HasSpeakerIdImage, !Ref SpeakerIdFunction, '']
          ECS_CLUSTER_ARN: !Ref AsrEcsCluster
          ECS_TASK_DEF_ARN: !If [HasAsrWorkerImageAndGpu, !Ref AsrWorkerTaskDefinition, '']
          ECS_FARGATE_TASK_DEF_ARN: !If [HasAsrWorkerImage, !Ref AsrWorkerTaskDefinitionFargate, '']
          ECS_PREFER_GPU: !Ref EcsPreferGpu
          ECS_CONTAINER_NAME: asr-worker
          ECS_SUBNET_IDS: !Join [',', [!Ref AsrPublicSubnetA, !Ref AsrPublicSubnetB]]
          ECS_SECURITY_GROUP_IDS: !Ref AsrTaskSecurityGroup
          ECS_TASK_ASSIGN_PUBLIC_IP: ENABLED
          ECS_GPU_TASK_NETWORK_MODE: !If [UseGpuPath, bridge, awsvpc]
          ECS_GPU_SPOT_CAPACITY_PROVIDER: !If [UseGpuPath, !Ref AsrGpuSpotCapacityProvider, '']
          ECS_GPU_ONDEMAND_CAPACITY_PROVIDER: !If [UseGpuPath, !Ref AsrGpuOnDemandCapacityProvider, '']
          ASR_GPU_SPOT_ASG_NAME: !If [UseGpuPath, !Ref AsrGpuSpotAutoScalingGroup, '']
          ASR_GPU_ONDEMAND_ASG_NAME: !If [UseGpuPath, !Ref AsrGpuOnDemandAutoScalingGroup, '']
          SQL_CLUSTER_ARN: !If
            - HasSql
            - !If [HasExternalSql, !Ref SqlClusterArn, !GetAtt AnalyticsDbCluster.DBClusterArn]
            - ''
          SQL_SECRET_ARN: !If
            - HasSql
            - !If [HasExternalSql, !Ref SqlSecretArn, !GetAtt AnalyticsDbCluster.MasterUserSecret.SecretArn]
            - ''
          SQL_DATABASE: !If [HasSql, !Ref SqlDatabase, '']
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref TranscriptsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyWordStatsTable
        - Statement:
            - Effect: Allow
              Action:
                - ecs:RunTask
              Resource: !If
                - HasAsrWorkerImageAndGpu
                - [!Ref AsrWorkerTaskDefinition, !Ref AsrWorkerTaskDefinitionFargate]
                - !If [HasAsrWorkerImage, [!Ref AsrWorkerTaskDefinitionFargate], '*']
            - Effect: Allow
              Action:
                - ecs:ListTasks
                - ecs:DescribeTasks
                - ecs:StopTask
              Resource: '*'
            - Effect: Allow
              Action:
                - ecs:DescribeServices
                - ecs:UpdateService
              Resource: '*'
            - Effect: Allow
              Action:
                - autoscaling:DescribeAutoScalingGroups
              Resource: '*'
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt AsrJobsQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AsrWarmStateTable.Arn
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !GetAtt AsrTaskExecutionRole.Arn
                - !GetAtt AsrTaskRole.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ApiFunction-*'
            - !If
              - HasSql
              - Effect: Allow
                Action:
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:ExecuteStatement
                  - rds-data:RollbackTransaction
                Resource: !If [HasExternalSql, !Ref SqlClusterArn, !GetAtt AnalyticsDbCluster.DBClusterArn]
              - !Ref AWS::NoValue
            - !If
              - HasSql
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !If [HasExternalSql, !Ref SqlSecretArn, !GetAtt AnalyticsDbCluster.MasterUserSecret.SecretArn]
              - !Ref AWS::NoValue
            - !If
              - HasSpeakerIdImage
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt SpeakerIdFunction.Arn
              - !Ref AWS::NoValue
      Events:
        CalibrationPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/calibration/presign
            Method: POST
        CalibrationStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/calibration/status
            Method: GET
        AppConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/app-config
            Method: GET
        AsrWarmup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/asr/warmup
            Method: POST
        AsrRuntimeStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/asr/runtime-status
            Method: GET
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: POST
        CreateTranscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcriptions
            Method: POST
        ListTranscriptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcriptions
            Method: GET
        GetTranscriptionStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcriptions/{transcriptId}/status
            Method: GET
        GetTranscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcriptions/{transcriptId}
            Method: GET
        GetTranscriptInteractions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcriptions/{transcriptId}/interactions
            Method: GET
        ProgressionDaily:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/progression/daily
            Method: GET
        ProgressionWeekly:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/progression/weekly
            Method: GET
        ProgressionMonthlyCalendar:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/progression/monthly-calendar
            Method: GET
        ProgressionMonthly:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/progression/monthly
            Method: GET
        ProgressionPosCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/progression/pos-categories
            Method: GET
        KidPercentile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/kid-percentile
            Method: GET
        InteractionsLatency:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/interactions/latency
            Method: GET

  AsrWarmControllerLogGroup:
    Condition: HasAsrWorkerImage
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-asr-warm-controller'
      RetentionInDays: 7

  AsrWarmControllerFunction:
    Condition: HasAsrWorkerImage
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-asr-warm-controller'
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Tracing: Active
      CodeUri: ../backend/src
      Handler: asr_warm_controller.handler
      Environment:
        Variables:
          ASR_WARM_STATE_TABLE: !Ref AsrWarmStateTable
          ASR_JOBS_QUEUE_URL: !Ref AsrJobsQueue
          ECS_CLUSTER_ARN: !Ref AsrEcsCluster
          ASR_WORKER_SERVICE_NAME: !Ref AsrWorkerService
          ASR_GPU_ONDEMAND_ASG_NAME: !If [UseGpuPath, !Ref AsrGpuOnDemandAutoScalingGroup, '']
          ASR_GPU_SPOT_ASG_NAME: !If [UseGpuPath, !Ref AsrGpuSpotAutoScalingGroup, '']
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - ecs:ListTasks
                - ecs:DescribeTasks
                - ecs:DescribeServices
                - ecs:UpdateService
              Resource: '*'
            - Effect: Allow
              Action:
                - autoscaling:DescribeAutoScalingGroups
                - autoscaling:UpdateAutoScalingGroup
              Resource: '*'
            - Effect: Allow
              Action:
                - sqs:GetQueueAttributes
              Resource: !GetAtt AsrJobsQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AsrWarmStateTable.Arn
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  WarmScaleUpMetricFilter:
    Condition: HasAsrWorkerImage
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AsrWarmControllerLogGroup
      FilterPattern: '{ $.event = "WarmScaleUp" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/ASR'
          MetricName: WarmScaleUp
          MetricValue: '1'

  WarmScaleDownMetricFilter:
    Condition: HasAsrWorkerImage
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AsrWarmControllerLogGroup
      FilterPattern: '{ $.event = "WarmScaleDown" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/ASR'
          MetricName: WarmScaleDown
          MetricValue: '1'

  QueueBacklogMetricFilter:
    Condition: HasAsrWorkerImage
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AsrWarmControllerLogGroup
      FilterPattern: '{ $.event = "QueueBacklog" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/ASR'
          MetricName: QueueBacklog
          MetricValue: '$.queueVisible'

  AsrWorkerEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  AsrWorkerBaseEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  AsrWorkerCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AsrWorkerCodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt AsrWorkerEcrRepo.Arn
                  - !GetAtt AsrWorkerBaseEcrRepo.Arn

  AsrWorkerCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-asr-build'
      ServiceRole: !GetAtt AsrWorkerCodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: APP_ECR_REPO_URI
            Value: !GetAtt AsrWorkerEcrRepo.RepositoryUri
          - Name: BASE_ECR_REPO_URI
            Value: !GetAtt AsrWorkerBaseEcrRepo.RepositoryUri
      Source:
        Type: S3
        Location: dummy/dummy.zip
        BuildSpec: buildspec.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

  SpeakerIdEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  SpeakerIdCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SpeakerIdCodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt SpeakerIdEcrRepo.Arn

  SpeakerIdCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-speakerid-build'
      ServiceRole: !GetAtt SpeakerIdCodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value: !GetAtt SpeakerIdEcrRepo.RepositoryUri
      Source:
        Type: S3
        Location: dummy/dummy.zip
        BuildSpec: buildspec.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

  SpeakerIdFunction:
    Condition: HasSpeakerIdImage
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref SpeakerIdImageUri
      Timeout: 900
      MemorySize: 3008
      Tracing: Active
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket
          CALIBRATION_BUCKET: !Ref UploadsBucket
          TRANSCRIPTS_TABLE: !Ref TranscriptsTable
          TRANSCRIPT_ID_INDEX: TranscriptIdIndex
          DAILY_WORD_STATS_TABLE: !Ref DailyWordStatsTable
          SPEAKER_ID_MIN_SIM: '0.35'
          SPEAKER_ID_MIN_MARGIN: '0.02'
          SPEAKER_ID_MIN_SEGMENT_S: '0.8'
          SPEAKER_ID_MAX_AUDIO_S: '60'
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref TranscriptsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyWordStatsTable

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  UploadsBucketName:
    Value: !Ref UploadsBucket
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: CloudFront frontend URL (HTTPS)
    Value: !Join ['', ['https://', !GetAtt FrontendDistribution.DomainName]]
  CloudFrontDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  DynamoTableName:
    Value: !Ref TranscriptsTable
  DailyWordStatsTableName:
    Value: !Ref DailyWordStatsTable
  AsrWorkerEcrRepoUri:
    Value: !GetAtt AsrWorkerEcrRepo.RepositoryUri
  AsrWorkerBaseEcrRepoUri:
    Value: !GetAtt AsrWorkerBaseEcrRepo.RepositoryUri
  AsrWorkerCodeBuildProjectName:
    Value: !Ref AsrWorkerCodeBuildProject
  AsrClusterName:
    Value: !Ref AsrEcsCluster
  AsrTaskDefinitionArn:
    Value: !If [HasAsrWorkerImageAndGpu, !Ref AsrWorkerTaskDefinition, '']
  AsrFargateFallbackTaskDefinitionArn:
    Value: !If [HasAsrWorkerImage, !Ref AsrWorkerTaskDefinitionFargate, '']
  AsrWorkerServiceName:
    Value: !If [HasAsrWorkerImage, !Ref AsrWorkerService, '']
  AsrJobsQueueUrl:
    Value: !Ref AsrJobsQueue
  AsrJobsQueueArn:
    Value: !GetAtt AsrJobsQueue.Arn
  AsrWarmStateTableName:
    Value: !Ref AsrWarmStateTable
  AsrGpuSpotCapacityProviderName:
    Value: !If [UseGpuPath, !Ref AsrGpuSpotCapacityProvider, '']
  AsrGpuOnDemandCapacityProviderName:
    Value: !If [UseGpuPath, !Ref AsrGpuOnDemandCapacityProvider, '']
  AsrGpuSpotAsgName:
    Value: !If [UseGpuPath, !Ref AsrGpuSpotAutoScalingGroup, '']
  AsrGpuOnDemandAsgName:
    Value: !If [UseGpuPath, !Ref AsrGpuOnDemandAutoScalingGroup, '']
  SpeakerIdEcrRepoUri:
    Value: !GetAtt SpeakerIdEcrRepo.RepositoryUri
  SpeakerIdCodeBuildProjectName:
    Value: !Ref SpeakerIdCodeBuildProject
  SqlEnabled:
    Value: !If [HasSql, 'true', 'false']
  SqlClusterArnOut:
    Value: !If
      - HasSql
      - !If [HasExternalSql, !Ref SqlClusterArn, !GetAtt AnalyticsDbCluster.DBClusterArn]
      - ''
  SqlSecretArnOut:
    Value: !If
      - HasSql
      - !If [HasExternalSql, !Ref SqlSecretArn, !GetAtt AnalyticsDbCluster.MasterUserSecret.SecretArn]
      - ''
