version: 0.2

env:
  variables:
    IMAGE_TAG: "dev"
    BASE_IMAGE_TAG: "stable-pos-v1"
    REBUILD_BASE: "false"

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws --version
      - APP_ECR_REPO_URI="${APP_ECR_REPO_URI:-$ECR_REPO_URI}"
      - REGISTRY="$(echo "$APP_ECR_REPO_URI" | cut -d/ -f1)"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - if [ -n "$BASE_ECR_REPO_URI" ]; then docker pull "$BASE_ECR_REPO_URI:$BASE_IMAGE_TAG" || true; fi
  build:
    commands:
      - echo Build started on `date`
      - |
        if [ "$REBUILD_BASE" = "true" ]; then
          echo Building ASR base image "$BASE_ECR_REPO_URI:$BASE_IMAGE_TAG"
          docker build -f Dockerfile.base -t "$BASE_ECR_REPO_URI:$BASE_IMAGE_TAG" .
          docker push "$BASE_ECR_REPO_URI:$BASE_IMAGE_TAG"
        fi
      - export BASE_IMAGE_URI="${BASE_IMAGE_URI:-$BASE_ECR_REPO_URI:$BASE_IMAGE_TAG}"
      - echo Using base image "$BASE_IMAGE_URI"
      - docker build -f Dockerfile.app --build-arg BASE_IMAGE_URI="$BASE_IMAGE_URI" -t "$APP_ECR_REPO_URI:$IMAGE_TAG" .
  post_build:
    commands:
      - echo Pushing...
      - docker push "$APP_ECR_REPO_URI:$IMAGE_TAG"
      - echo "IMAGE_URI=$APP_ECR_REPO_URI:$IMAGE_TAG"
