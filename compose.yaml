services:
  postgres:
    image: postgres:16-alpine
    container_name: aws-lumi-local-postgres
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi
    ports:
      - "54329:5432"
    volumes:
      - lumi_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lumi_local_postgres:
